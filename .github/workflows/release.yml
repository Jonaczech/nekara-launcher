name: publikace

on:
  push:
    tags:
      - "app-v*"

jobs:
  publikace-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: stažení kódu
        uses: actions/checkout@v4

      - name: nastavení pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: nastavení node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: instalace stabilního Rustu
        uses: dtolnay/rust-toolchain@stable

      - name: instalace frontendových závislostí
        run: pnpm install --frozen-lockfile

      - name: sestavení a publikace
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: Nekara Launcher v__VERSION__
          releaseBody: Podepsaný Windows build a metadata updateru pro Nekara Launcher.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
